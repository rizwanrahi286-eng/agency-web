<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Luxury Obsidian -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E182A"/>
      <stop offset="50%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>

    <!-- Border Ring: Radiant Emerald-Teal to Cyan-Sky -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5C0"/>
      <stop offset="30%" stop-color="#00D2B4"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Radial Core Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#00D2B4" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.20"/>
      <stop offset="85%" stop-color="#090E1A" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Wing Outer Blade: Sky Blue to Mint Teal -->
    <linearGradient id="leftOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#00D2B4"/>
    </linearGradient>

    <!-- Left Wing Bevel: Deep Emerald to Teal -->
    <linearGradient id="leftInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2B4"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Center Left Ascending: Vivid Teal to Brilliant Mint -->
    <linearGradient id="centerLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2B4"/>
      <stop offset="45%" stop-color="#00E5C0"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <!-- Center Right Descending: Mint to Deep Cyan -->
    <linearGradient id="centerRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Right Wing Outer: Teal to Electric Cyan and Sky -->
    <linearGradient id="rightOuter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2B4"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Right Wing Bevel: Deep Cyan to Teal -->
    <linearGradient id="rightInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00D2B4"/>
    </linearGradient>

    <!-- Sheen Highlight -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 3D Overlap Shadow -->
    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00D2B4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Badge (Superellipse with high curvature) -->
  <rect x="18" y="18" width="476" height="476" rx="122" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="7"/>

  <!-- Ambient Neon Radial Glow -->
  <circle cx="256" cy="265" r="185" fill="url(#ambientGlow)"/>

  <!-- Ultra-fine Interior Tech Ring -->
  <rect x="26" y="26" width="460" height="460" rx="114" fill="none" stroke="#00D2B4" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- ==================== W MONOGRAM ==================== -->
  <g filter="url(#neonFilter)">
    <!-- 1. Left Wing Outer Blade -->
    <polygon points="84,142 144,126 206,394 146,394" fill="url(#leftOuter)"/>
    
    <!-- 1b. Left Wing Bevel (Chiseled 3D Face) -->
    <polygon points="144,126 160,132 220,394 206,394" fill="url(#leftInner)" opacity="0.9"/>
    
    <!-- 1c. Left Wing Sheen -->
    <polygon points="84,142 98,142 160,394 146,394" fill="url(#sheen)" opacity="0.45"/>

    <!-- 2. Right Wing Outer Blade -->
    <polygon points="366,394 428,142 368,126 306,394" fill="url(#rightOuter)"/>
    
    <!-- 2b. Right Wing Bevel (Chiseled 3D Face) -->
    <polygon points="368,126 352,132 292,394 306,394" fill="url(#rightInner)" opacity="0.9"/>

    <!-- 2c. Right Wing Sheen -->
    <polygon points="414,142 428,142 366,394 352,394" fill="url(#sheen)" opacity="0.45"/>

    <!-- 3. Center Right Descending Ribbon -->
    <polygon points="230,214 290,214 344,394 282,394" fill="url(#centerRight)"/>

    <!-- 4. Center Left Ascending Ribbon (Overlaps with 3D Drop-Shadow) -->
    <g filter="url(#foldShadow)">
      <polygon points="168,394 230,394 294,214 232,214" fill="url(#centerLeft)"/>
      <polygon points="232,214 246,214 182,394 168,394" fill="url(#sheen)" opacity="0.5"/>
    </g>

    <!-- 5. Quantum Diamond Apex Spark (Unified with Center Notch) -->
    <g filter="url(#foldShadow)">
      <!-- Outer Diamond -->
      <polygon points="256,142 278,174 256,206 234,174" fill="#FFFFFF"/>
      <!-- Inner Glowing Core -->
      <polygon points="256,148 272,174 256,200 240,174" fill="#80FFF0"/>
      <!-- Center Star Point -->
      <polygon points="256,156 264,174 256,192 248,174" fill="#00D2B4"/>
      <!-- Brilliant Core Lens Flare Flares -->
      <line x1="220" y1="174" x2="292" y2="174" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
      <line x1="256" y1="138" x2="256" y2="210" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    </g>
  </g>
</svg>